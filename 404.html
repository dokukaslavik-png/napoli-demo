<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — NAPOLI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
<style>
  .err{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px 0}
  .err h1{font-size:clamp(3rem,12vw,8rem);color:var(--paper)}
  .err h1 em{font-style:normal;color:var(--gold)}
  .err .lead{margin:16px auto 0}
</style>
</head>
<body class="on-red">
  <section class="hero err">
    <div class="wrap">
      <span class="eyebrow" style="color:var(--gold);justify-content:center">Error 404</span>
      <h1>This slice is<br><em>gone</em></h1>
      <p class="lead">The page you're after doesn't exist or has moved. Let's get you back to the pizza.</p>
      <div style="margin-top:30px"><a href="index.html" class="btn btn-solid">Back home</a></div>
    </div>
  </section>
</body>
</html>
